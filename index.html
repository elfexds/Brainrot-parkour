<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>brainrot parkour</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #unity-canvas {
      width: 100%;
      height: 100%;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 0; /* el juego abajo */
    }
    /* Caja del slider arriba a la derecha */
    #sens-box {
      position: absolute;
      top: 20px;
      right: 20px;
      z-index: 9999; /* bien arriba del canvas */
      background: rgba(0,0,0,0.7);
      color: #fff;
      padding: 10px;
      border-radius: 10px;
      font-family: sans-serif;
      font-size: 14px;
    }
    #sens-box input[type=range] {
      width: 150px;
    }
  </style>
</head>
<body>
  <!-- Canvas del juego -->
  <canvas id="unity-canvas"></canvas>

  <!-- Caja de sensibilidad -->
  <div id="sens-box">
    Sensibilidad:<br>
    <input type="range" id="sensSlider" min="0.1" max="5" step="0.1" value="1">
  </div>

  <script>
    const buildUrl = "."; 
    const loaderUrl = buildUrl + "/UnityLoader.js";

    const config = {
      dataUrl: buildUrl + "/game.data.unityweb",
      frameworkUrl: buildUrl + "/game.asm.framework.js.unityweb",
      codeUrl: buildUrl + "/d8255148f741773487e81d776b407f14.wasm.unityweb",
      streamingAssetsUrl: buildUrl + "/StreamingAssets",
    };

    let unityInstance = null;

    const script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = () => {
      createUnityInstance(document.querySelector("#unity-canvas"), config, (progress) => {
        console.log("Cargando: " + (progress * 100).toFixed(1) + "%");
      }).then((instance) => {
        unityInstance = instance;
        console.log("Juego cargado 🎮");
      }).catch((err) => {
        console.error(err);
      });
    };
    document.body.appendChild(script);

    // Slider de sensibilidad
    const slider = document.getElementById('sensSlider');
    slider.addEventListener('input', () => {
      const value = parseFloat(slider.value);
      if (unityInstance) {
        unityInstance.SendMessage("PlayerController", "SetSensitivity", value);
        console.log("Sensibilidad enviada:", value);
      }
    });
  </script>
</body>
</html>
