<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Brainrot Parkour</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #000;
      height: 100%;
      overflow: hidden;
    }
    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
    }
    #unity-canvas {
      background: #222;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: Arial, sans-serif;
      font-size: 20px;
      color: white;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas"></canvas>
  </div>
  <div id="loading">Cargando Brainrot Parkour...</div>

  <script src="UnityLoader.js"></script>
  <script>
    var buildUrl = ""; // mismo folder

    var unityInstance = UnityLoader.instantiate("unity-canvas", {
      dataUrl: buildUrl + "game.data.unityweb",
      frameworkUrl: buildUrl + "game.asm.framework.unityweb",
      codeUrl: buildUrl + "d8255148f741773487e81d776b407f14.wasm.unityweb",
    }, function(progress) {
      var loading = document.getElementById("loading");
      if (progress === 1) {
        loading.style.display = "none";
      } else {
        loading.innerHTML = "Cargando... " + Math.round(progress * 100) + "%";
      }
    });
  </script>
</body>
</html>
