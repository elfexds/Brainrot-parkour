<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Brainrot Parkour</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <style>
    /* General */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, sans-serif;
      overflow: hidden;
    }

    #unityContainer {
      width: 100%;
      height: 100%;
      background: #000;
    }

    /* Pantalla de carga */
    #loadingBox {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #111;
      z-index: 10;
    }

    #progressBarEmpty {
      width: 80%;
      height: 20px;
      border: 1px solid #fff;
      margin-top: 20px;
      background: #333;
    }

    #progressBarFull {
      height: 100%;
      width: 0%;
      background: #00ff88;
    }
  </style>

  <!-- Cargamos UnityLoader -->
  <script src="UnityLoader.js"></script>
</head>
<body>
  <!-- Contenedor del juego -->
  <div id="unityContainer"></div>

  <!-- Pantalla de carga -->
  <div id="loadingBox">
    <h2>Cargando Brainrot Parkour...</h2>
    <div id="progressBarEmpty">
      <div id="progressBarFull"></div>
    </div>
  </div>

  <script>
    // Ruta base (mismo folder donde están los archivos .unityweb y .js)
    var buildUrl = "./";

    // Inicializamos Unity
    var gameInstance = UnityLoader.instantiate("unityContainer", {
      dataUrl: buildUrl + "game.data.unityweb",
      frameworkUrl: buildUrl + "game.asm.framework.unityweb",
      codeUrl: buildUrl + "d8255148f741773487e81d776b407f14.wasm.unityweb"
    }, { onProgress: UnityProgress });

    // Sistema de progreso
    function UnityProgress(gameInstance, progress) {
      var loadingBox = document.getElementById("loadingBox");
      var bar = document.getElementById("progressBarFull");
      if (!loadingBox) return;
      if (progress < 1) {
        bar.style.width = (progress * 100) + "%";
      } else {
        loadingBox.style.display = "none"; // ocultar al terminar
      }
    }
  </script>
</body>
</html>
